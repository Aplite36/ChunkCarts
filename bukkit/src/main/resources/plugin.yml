name: ChunkCarts
version: '${version}'
main: io.github.aplite36.chunkcarts.bukkit.ChunkCartsPlugin
description: Minecarts load chunks while travelling. Closed and looping tracks stop loading automatically.
author: Aplite36
website: https://github.com/Aplite36/ChunkCarts

# The 1.21 API floor. Bukkit is forward-compatible at runtime, so one jar covers 1.21 -> 26.3.
api-version: '1.21'

# Folia is out of scope for v0.1 — its regionised tick loop means cross-region
# ticket acquisition and genuinely concurrent state. Declared explicitly so Folia refuses
# to load this rather than running it in a broken configuration.
folia-supported: false

commands:
  chunkcarts:
    description: Inspect and manage ChunkCarts.
    usage: /chunkcarts <list|reload|debug|why|help>
    permission: chunkcarts.admin
    # No /cc alias: it collides with chat-clear commands on a great many servers.
    aliases: [ccarts]

permissions:
  chunkcarts.admin:
    description: Use /chunkcarts. There is deliberately no per-player permission beyond this.
    default: op
