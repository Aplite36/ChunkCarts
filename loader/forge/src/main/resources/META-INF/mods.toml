modLoader = "javafml"
# The major of the Forge version this node builds against. FML only accepts a major here.
loaderVersion = "[${loader},)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/Aplite36/ChunkCarts/issues"

[[mods]]
modId = "chunkcarts"
version = "${version}"
displayName = "ChunkCarts"
authors = "Aplite36"
displayURL = "https://modrinth.com/mod/chunkcarts"
# The README promises clients need nothing. Without this the field defaults to MATCH_VERSION,
# which makes FML ask a connecting client for the same mod and mark the server incompatible in
# the client's server list when it has not got it. Read off `ModContainer` in the fmlcore jar of
# all fifteen targets — it pulls `displayTest` out of mods.toml, switches on MATCH_VERSION,
# IGNORE_SERVER_VERSION, IGNORE_ALL_VERSION and NONE, falls back to MATCH_VERSION when the key is
# absent, and throws "Invalid displayTest value supplied in mods.toml" on anything else. So the
# spelling here is exact, not approximate.
#
# The `side = "SERVER"` keys below are on the dependency blocks and say something else entirely —
# that *this mod's* dependencies are only needed server-side — so they do not cover this.
displayTest = "IGNORE_SERVER_VERSION"
description = '''
Minecarts load chunks while travelling. Closed and looping tracks stop loading automatically, so
carts cannot be turned into chunk loaders.
'''

[[dependencies.chunkcarts]]
modId = "forge"
# Forge spells this `mandatory`, not NeoForge's `type = "required"`, and it has no default: a
# dependency block without it is rejected outright and the mod silently never loads. Verified
# against ModInfo's ModVersion in the fmlloader jar of all fifteen targets — `mandatory` on every
# one, `type` on none.
mandatory = true
versionRange = "[${loader},)"
ordering = "NONE"
side = "SERVER"

[[dependencies.chunkcarts]]
modId = "minecraft"
mandatory = true
# Exactly this version, not a floor. One jar ships per game version, and an open-ended
# range would have the 1.21 jar claim to run on 26.2 — where half the API it calls is gone.
versionRange = "[${mc}]"
ordering = "NONE"
side = "SERVER"
