group=io.github.aplite36
version=0.1.0

org.gradle.caching=true
org.gradle.parallel=true

# Deliberately NOT configure-on-demand, however tempting it looks. Forge's own MDK ships
# `org.gradle.configureondemand=true`, and it does stop a single-target request from configuring
# the whole Stonecutter tree — but in a multi-project build whose buildscripts are Kotlin it fails
# with "ClassLoaderScope must be locked before it can be used to compute a classpath" as soon as
# the requested task pulls in a sibling project, with or without parallel configuration. Measured
# on Gradle 9.6.1: `:loader:forge:1.21.11:dependencies` succeeds, `…:build` does not.
# The fan-out it was meant to fix is handled in loader/stonecutter.gradle.kts instead.

# Loom decompiles and remaps Minecraft; the default heap is not enough for it.
org.gradle.jvmargs=-Xmx4G

# Loom is not configuration-cache safe. Left explicit so a future Gradle default flip
# does not turn every loader build red at once.
org.gradle.configuration-cache=false

# One loader version across the whole matrix — Fabric Loader is backwards compatible, so the
# per-version property is the Fabric API build, which is not.
fabric_loader_version=0.19.3

# Restored: see the measurement in loader/stonecutter.gradle.kts.
org.gradle.configureondemand=true
