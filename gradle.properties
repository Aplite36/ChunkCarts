group=io.github.aplite36
version=0.1.1-SNAPSHOT

org.gradle.caching=true
org.gradle.parallel=true

# Configure-on-demand was turned off once, on evidence that looked damning: on Gradle 9.6.1, with
# it on, `:loader:forge:1.21.11:dependencies` succeeded but `…:build` failed with "ClassLoaderScope
# must be locked before it can be used to compute a classpath" as soon as the task pulled in a
# sibling project, with or without parallel configuration. The actual trigger was something else —
# Stonecutter's own task collection and `project(...)` task lookups reaching across the tree and
# realising sibling tasks eagerly. loader/stonecutter.gradle.kts now avoids that (string task
# paths, no `order("build")`, no `dependsOn` on Stonecutter's collection), and with nothing forcing
# sibling tasks into existence the ClassLoaderScope failure did not recur. That fix is also what
# makes configure-on-demand load-bearing rather than an optimisation: see the measurement there.

# Loom decompiles and remaps Minecraft; the default heap is not enough for it.
org.gradle.jvmargs=-Xmx4G

# Loom is not configuration-cache safe. Left explicit so a future Gradle default flip
# does not turn every loader build red at once.
org.gradle.configuration-cache=false

# One loader version across the whole matrix — Fabric Loader is backwards compatible, so the
# per-version property is the Fabric API build, which is not.
fabric_loader_version=0.19.3

# Restored: see the measurement in loader/stonecutter.gradle.kts.
org.gradle.configureondemand=true
